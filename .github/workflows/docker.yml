name: Build & Publish Docker Image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker-compose.yml
      - .dockerignore
      - server.js
      - package.json
      - public/**
      - collector-src/**
      - .github/workflows/docker.yml
    tags: ['v*']
  workflow_dispatch:

# 让 Actions 有写 packages 的权限，无需额外 PAT
permissions:
  contents: read
  packages: write

jobs:
  # Job 1：在 Windows runner 上用 .NET Framework csc 编译采集器 exe
  # 仓库不含 exe（保持干净），但镜像需要 exe 供员工下载
  build-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 编译 collect.exe（控制台版）
        working-directory: collector-src
        shell: pwsh
        run: |
          $csc = 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $csc /nologo /platform:anycpu `
            /r:System.Management.dll `
            /out:..\public\collect.exe collect.cs

      - name: 编译 collect-ui.exe（图形界面版）
        working-directory: collector-src
        shell: pwsh
        run: |
          $csc = 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $csc /nologo /platform:anycpu `
            /r:System.Management.dll `
            /r:System.Windows.Forms.dll `
            /r:System.Drawing.dll `
            /out:..\public\collect-ui.exe collect-ui.cs

      - name: 上传采集器 artifact
        uses: actions/upload-artifact@v4
        with:
          name: collector-exe
          path: public/*.exe
          if-no-files-found: error
          retention-days: 1

  # Job 2：下载 exe 放到 public/，多架构构建并推送镜像
  build-and-push:
    needs: build-exe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 下载采集器 exe（来自 Windows 编译 job）
        uses: actions/download-artifact@v4
        with:
          name: collector-exe
          path: public/

      - name: 确认 exe 已就位
        shell: bash
        run: ls -lh public/*.exe

      - name: Set up QEMU（多架构模拟）
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取 tag 元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # main 推 :latest，打 tag v1.0.0 时附带 :1.0.0、:1.0、:1
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short

      - name: 构建并推送（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
