# ==============================================================
#  Release signed exes via SignPath (Open Source Code Signing)
#  触发：打 git tag（如 v1.0.0）→ 编译 → SignPath 签名 → 上传 Release
#
#  前置配置（GitHub 仓库 Settings → Secrets and variables → Actions）：
#    SIGNPATH_API_TOKEN            SignPath API Token（submitter 权限）
#    SIGNPATH_ORGANIZATION_ID      SignPath 组织 ID
#    SIGNPATH_PROJECT_SLUG         SignPath 项目 slug
#    SIGNPATH_SIGNING_POLICY_SLUG  签名策略 slug（OSS 用 open-source 之类）
#
#  SignPath 侧前置：
#    1. https://signpath.io 注册账号
#    2. 申请 Open Source Code Signing（开源项目免费）
#    3. 创建项目 + signing policy（artifact 配置选 zip-file 类型）
#    4. 安装 SignPath GitHub App 并授权本仓库
#    5. 在项目里关联 GitHub trusted build system
#
#  注意：SignPath OSS 用的是 OV 证书，签名后 exe 显示发布者 SignPath，
#  但 SmartScreen 蓝色窗可能仍弹（需积累下载量才建立信誉）。EV 证书才能可靠消除。
# ==============================================================
name: Release signed exes

on:
  push:
    tags: ['v*']

permissions:
  actions: read
  contents: write   # 创建 Release 需要

jobs:
  build-sign-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile exes (.NET Framework 4, csc)
        shell: pwsh
        run: |
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          Write-Host "Compiling collect.exe (console)..."
          & $csc /nologo /platform:anycpu /r:System.Management.dll `
            /out:collect.exe collector-src/collect.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "Compiling collect-ui.exe (GUI)..."
          & $csc /nologo /platform:anycpu /r:System.Management.dll `
            /r:System.Windows.Forms.dll /r:System.Drawing.dll `
            /out:collect-ui.exe collector-src/collect-ui.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item collect.exe, collect-ui.exe | Select-Object Name, Length

      - name: Upload unsigned artifacts
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exes
          path: |
            collect.exe
            collect-ui.exe

      - name: Submit to SignPath for signing
        id: sign
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Extract signed zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path signed-exes | Out-Null
          Get-ChildItem signed -Filter *.zip | ForEach-Object {
            Write-Host "Extracting $($_.Name)"
            Expand-Archive -Path $_.FullName -DestinationPath signed-exes -Force
          }
          Write-Host "--- Signed exes ---"
          Get-ChildItem signed-exes -Filter *.exe | Select-Object Name, Length

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-exes
          path: signed-exes/*.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: signed-exes/*.exe
          generate_release_notes: true
          prerelease: false
